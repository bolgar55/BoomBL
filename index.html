<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Block Blast</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Telegram Web Apps SDK (R02/R24/R25). Вне Telegram файл всё равно
       грузится и просто ничего не делает — telegram-bridge сам проверяет
       наличие window.Telegram?.WebApp и работает в безопасном режиме
       (spec §Решения 9, R46i), поэтому подключение SDK ничего не ломает
       в обычном браузере при разработке. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div id="score-panel">
        <span id="score-label">Очки</span>
        <span id="score-value">0</span>
        <span id="combo-value" hidden></span>
      </div>

      <div id="high-score-panel">
        <span id="high-score-label">Рекорд</span>
        <span id="high-score-value">0</span>
      </div>

      <div id="top-actions">
        <button id="language-btn" type="button" aria-label="Язык">RU</button>
        <!-- Кнопку-переключатель звука монтирует сам ui/sound.js
             (mountToggleButton) — здесь только слот-контейнер для неё. -->
        <span id="sound-toggle-slot"></span>
      </div>
    </header>

    <!-- Ежедневный челлендж (R14): цель и прогресс, одинаковые у всех
         игроков в этот день, обновляются по ходу партии. -->
    <section id="challenge-panel" aria-live="polite">
      <span id="challenge-label"></span>
      <span id="challenge-progress"></span>
    </section>

    <main id="board-wrap">
      <canvas id="board-canvas"></canvas>
      <canvas id="effects-canvas" aria-hidden="true"></canvas>
      <!-- Всплывающий "+N" за бонус (R19) — узлы создаёт/удаляет
           ui/animations.js (playBonusPopup), см. style.css .bonus-popup. -->
      <div id="bonus-layer" aria-hidden="true"></div>
    </main>

    <!-- Плавающий canvas перетаскиваемой фигуры (R05): position:fixed
         относительно viewport, поэтому не обрезается overflow:hidden
         у #board-wrap и видна над всем экраном, а не только над полем.
         Размер/содержимое задаёт ui/input.js на каждый drag. -->
    <canvas id="drag-float" class="drag-float" aria-hidden="true"></canvas>

    <p id="status-line"></p>

    <footer id="tray">
      <canvas class="tray-slot" data-index="0"></canvas>
      <canvas class="tray-slot" data-index="1"></canvas>
      <canvas class="tray-slot" data-index="2"></canvas>
    </footer>
  </div>

  <!-- Контейнер для оверлея Game Over (ui/gameover.js строит DOM внутри
       сам при первом show(), см. interfaces.md). -->
  <div id="overlay-root"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
