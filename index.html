<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BoomBL</title>
  <link rel="stylesheet" href="./style.css?v=0.5.1" />
  <!-- Telegram Web Apps SDK. Outside Telegram this still loads and just does
       nothing - telegram-bridge itself checks for window.Telegram?.WebApp
       and runs in a safe mode, so loading the SDK doesn't break anything in
       a plain browser during development. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div id="score-panel">
        <span id="score-label">Очки</span>
        <span id="score-value">0</span>
        <span id="combo-value" hidden></span>
      </div>

      <div id="high-score-panel">
        <span id="high-score-label">Рекорд</span>
        <span id="high-score-value">0</span>
      </div>

      <div id="top-actions">
        <button id="leaderboard-btn" type="button" aria-label="Таблица лидеров">🥇</button>
        <button id="achievements-btn" type="button" aria-label="Достижения">🏆</button>
        <button id="language-btn" type="button" aria-label="Язык">RU</button>
      </div>
    </header>

    <!-- Daily challenge: goal and progress, same for every player on a given
         day, updated as the game progresses. -->
    <section id="challenge-panel" aria-live="polite">
      <span id="challenge-label"></span>
      <span id="challenge-progress"></span>
    </section>

    <main id="board-wrap">
      <canvas id="board-canvas"></canvas>
      <canvas id="effects-canvas" aria-hidden="true"></canvas>
      <!-- Popup "+N" bonus text - nodes are created/removed by
           ui/animations.js (playBonusPopup), see style.css .bonus-popup. -->
      <div id="bonus-layer" aria-hidden="true"></div>
    </main>

    <!-- Floating canvas for the dragged shape: position:fixed relative to
         the viewport, so it isn't clipped by #board-wrap's overflow:hidden
         and stays visible across the whole screen, not just over the board.
         Size/content is set by ui/input.js on every drag. -->
    <canvas id="drag-float" class="drag-float" aria-hidden="true"></canvas>

    <p id="status-line"></p>

    <footer id="tray">
      <canvas class="tray-slot" data-index="0"></canvas>
      <canvas class="tray-slot" data-index="1"></canvas>
      <canvas class="tray-slot" data-index="2"></canvas>
    </footer>
  </div>

  <!-- Container for the Game Over overlay (ui/gameover.js builds its own DOM
       into this on first show()). -->
  <div id="overlay-root"></div>

  <!-- Small, unobtrusive version tag in the corner of the screen. -->
  <span id="version-tag" class="version-tag" aria-hidden="true">v0.5.1</span>

  <script type="module" src="./app.js?v=0.5.1"></script>
</body>
</html>
